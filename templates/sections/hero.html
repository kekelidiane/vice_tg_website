{% load static %}

<section id="home"
  class="relative -mt-16 flex min-h-screen flex-col overflow-hidden px-6 pt-16 md:-mt-[4.5rem] md:px-12 md:pt-[4.5rem] lg:-mt-20 lg:px-24 lg:pt-20">
  <div class="absolute inset-0 z-0">
    <img src="{% static 'assets/agroecologie/laitues-plan-global.jpg' %}"
      alt="Périmètre de culture de l'association VICE TOGO" class="size-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-br from-black/70 via-black/45 to-vice-green-900/50"></div>
  </div>

  <div class="relative z-10 flex flex-1 flex-col justify-center">
    <div class="max-w-3xl py-10 md:py-16">
      <span class="mb-4 inline-block text-sm font-semibold uppercase tracking-[0.2em] text-vice-gold-300">
        Association
      </span>
      <h1 class="text-5xl font-extrabold leading-[1.05] text-white drop-shadow-sm sm:text-6xl md:text-7xl lg:text-8xl">
        VICE <span class="text-vice-green-300">TOGO</span>
      </h1>
      <p class="mt-3 text-lg font-medium text-vice-gold-200 md:text-2xl">
        Vie · Culture · Environnement
      </p>

      <p class="mt-6 max-w-xl text-base leading-relaxed text-gray-100 md:text-lg">
        Nous sommes une association d'aide et de solidarité. <br>
        Nous œuvrons pour l'éducation des enfants les plus démunis, <br>
        la promotion de l'agriculture biologique et le reboisement. <br>
      </p>

      <div class="mt-8 flex flex-wrap gap-4">
        <a href="{% url 'core:blog_list' %}"
          class="inline-flex items-center justify-center gap-2 rounded-xl border border-white/70 px-6 py-3 font-semibold text-white transition hover:bg-white/10">
          Découvrir nos activités
        </a>
      </div>
    </div>

    <div class="mt-auto flex justify-end pb-10 md:pb-14">
      <div class="flex items-center gap-3 rounded-full border border-white/20 bg-black/30 px-5 py-2 backdrop-blur-md">
        <span class="h-2 w-2 rounded-full bg-vice-gold-300 animate-pulse"></span>
        <span class="text-sm font-bold uppercase tracking-[0.25em] text-white md:text-base">
          Togo
        </span>
      </div>
    </div>
  </div>
</section>
