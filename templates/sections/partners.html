{% load static %}
<section id="partners" class="bg-white px-6 py-16 md:px-12 lg:px-24">

    <p class="text-lg leading-relaxed text-gray-700">...</p>
  </div>

  <div class="mx-auto flex max-w-5xl flex-row flex-wrap items-center justify-center gap-8 md:gap-12">

    <div
      class="flex h-28 w-52 md:h-36 md:w-64 items-center justify-center overflow-hidden rounded-2xl border-4 border-gray-100 bg-white p-4 shadow-md transition-transform duration-300 hover:scale-105">
      <img src="{% static 'assets/logos/logo-addil.png' %}" alt="ADDIL" class="max-h-full max-w-full object-contain">
    </div>

    <div
      class="flex h-28 w-52 md:h-36 md:w-64 items-center justify-center overflow-hidden rounded-2xl border-4 border-gray-100 bg-white p-4 shadow-md transition-transform duration-300 hover:scale-105">
      <img src="{% static 'assets/logos/logo-ujpod.jpg' %}" alt="UJPOD Togo"
        class="max-h-full max-w-full object-contain">
    </div>

  </div>

  <div class="mx-auto mt-12 max-w-2xl text-center">
    <p class="text-base leading-relaxed text-gray-600">
      Vous avez envie de vous engager à nos côtés comme eux ? Contactez-nous
    </p>

</section>
